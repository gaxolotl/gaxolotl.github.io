<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greyfens</title>
    <style>
        /* Modern CSS Reset & Variable Definitions */
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --card-border: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-color: #58a6ff;
            --accent-hover: #1f6feb;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-sans);
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        /* Global Button Styling */
        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: #0d1117;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            color: #ffffff;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Grid Layout for Players */
        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
        }

        /* Card Styling */
        .player-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1rem;
            position: relative;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .player-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
        }

        .player-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .player-name {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
            word-break: break-all;
        }

        .last-name {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .card-actions {
            margin-top: auto;
        }

        .btn-sm {
            display: block;
            width: 100%;
            padding: 0.4rem 0.75rem;
            font-size: 0.825rem;
            background-color: transparent;
            border: 1px solid var(--card-border);
            color: var(--accent-color);
        }

        .btn-sm:hover {
            background-color: rgba(88, 166, 255, 0.1);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Feedback States */
        .status-message {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .error-message {
            color: #ff7b72;
            border: 1px dashed #ff7b72;
            border-radius: 8px;
            background-color: rgba(248, 81, 73, 0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Greyfen Database</h1>
            <p class="subtitle">List of all (known) Greyfens</p>
        </header>

        <header>
            <h2 style="color:rgb(241, 229, 174)">Note</h2>
            <p class="subtitle" style="color:rgb(235, 214, 122)">Many players have changed their usernames on Minecraft. Use <a href="https://namemc.com" target="_blank" rel="noopener noreferrer" style="color:rgb(240, 238, 144); text-decoration: underline;">NameMC</a> to find the current username.</p>
        </header>

        <main id="app">
            <div id="status" class="status-message">Loading players...</div>
            <div id="player-grid" class="player-grid"></div>
        </main>
    </div>

<script>
    const API_URL = "https://raw.githubusercontent.com/gaxolotl/gaxolotl/refs/heads/main/players.json";
    
    const gridElement = document.getElementById('player-grid');
    const statusElement = document.getElementById('status');
    
    let loadedPlayers = [];

    async function fetchPlayers() {
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            
            loadedPlayers = await response.json();
            statusElement.style.display = 'none';
            
            loadedPlayers.forEach(playerData => {
                const playerName = playerData.player || "Unknown Player";
                const lastName = playerData.last_name || "?";
                const namemcUrl = `https://namemc.com/profile/${encodeURIComponent(playerName)}`;

                const card = document.createElement('div');
                card.className = 'player-card';
                card.id = `player-${playerName.toLowerCase()}`;
                
                card.innerHTML = `
                    <div class="player-info">
                        <div class="player-header">
                            <div class="player-name">${playerName}</div>
                        </div>
                        <div class="last-name">Last Name: ${lastName}</div>
                    </div>
                    <div class="card-actions">
                        <a href="${namemcUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-sm">View on NameMC</a>
                    </div>
                `;
                
                gridElement.appendChild(card);
            });

        } catch (error) {
            console.error("Failed to fetch player data:", error);
            statusElement.textContent = "Failed to load player data. Please try again later.";
            statusElement.classList.add('error-message');
        }
    }

    fetchPlayers();
</script>
</body>
</html>
