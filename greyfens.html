<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greyfens</title>
    <style>
        /* Modern CSS Reset & Variable Definitions */
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --card-border: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-color: #58a6ff;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-sans);
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Grid Layout for Players */
        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
        }

        /* Sleek Card Styling */
        .player-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 1.25rem;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .player-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
        }

        .player-name {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .last-name {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* Feedback States (Loading / Error) */
        .status-message {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .error-message {
            color: #ff7b72;
            border: 1px dashed #ff7b72;
            border-radius: 8px;
            background-color: rgba(248, 81, 73, 0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Greyfen Database</h1>
            <p class="subtitle">List of all (known) Greyfens</p>
        </header>

        <main id="app">
            <div id="status" class="status-message">Loading players...</div>
            <div id="player-grid" class="player-grid"></div>
        </main>
    </div>

    <script>
        const API_URL = "https://raw.githubusercontent.com/gaxolotl/gaxolotl/refs/heads/main/players.json";
        const gridElement = document.getElementById('player-grid');
        const statusElement = document.getElementById('status');

        async function fetchPlayers() {
            try {
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const players = await response.json();
                
                // Clear the loading message
                statusElement.style.display = 'none';
                
                // Render players
                players.forEach(playerData => {
                    const card = document.createElement('div');
                    card.className = 'player-card';
                    
                    // Fallback text if a field is completely missing
                    const playerName = playerData.player || "Unknown Player";
                    const lastName = playerData.last_name || "?";

                    card.innerHTML = `
                        <div class="player-name">${playerName}</div>
                        <div class="last-name">Last Name: ${lastName}</div>
                    `;
                    
                    gridElement.appendChild(card);
                });

            } catch (error) {
                console.error("Failed to fetch player data:", error);
                statusElement.textContent = "Failed to load player data. Please try again later.";
                statusElement.classList.add('error-message');
            }
        }

        // Run the fetch on page load
        fetchPlayers();
    </script>
</body>
</html>
